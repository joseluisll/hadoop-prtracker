name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q -f *.py tests
      - name: Command-line help
        run: |
          for script in analyze_pr fix_dependencies pr_manager create_jira qbt_jira list_upstream_prs list_stale_branches; do
            echo "::group::$script --help"
            python "$script.py" --help
            echo "::endgroup::"
          done
      - name: Offline smoke tests
        run: |
          python tests/plan_smoke.py
          python tests/qbt_smoke.py
